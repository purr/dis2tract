    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a31"/>
      <stop offset="1" stop-color="#121216"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#tile)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="none" stroke="#fff" stroke-opacity="0.14"/>
  <path d="M27 8 V19" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M27 28 a8.5 8.5 0 0 1 -17 0 V23 l4.5 3.5" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M31.5 21.5 l5 -2.5 M31.5 25 l5 2.5" stroke="#ff5a36" stroke-width="3" stroke-linecap="round"/>
</svg>
