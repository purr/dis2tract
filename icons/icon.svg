<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- feeds are built to hook you: a fishhook, snapped. a gap in the bend and orange break marks; a slash across
       the gap read as a check mark, the opposite meaning -->
